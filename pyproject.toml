[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-desktop"
dynamic = ["version"]
description = "Windows desktop music library, MP3 player, and YouTube playlist downloader"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "yt-dlp[default]>=2026.10.26",
  "imageio-ffmpeg>=0.8.1",
  "Pillow>=13.0.0",
  "pygame-ce>=2.5.8",
  "mutagen>=1.48.1",
  "requests>=2.34.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "build>=1.2"]
build = ["pyinstaller>=6.22", "wheel>=0.45"]
icons = ["resvg-py>=0.5"]

[project.gui-scripts]
yt = "yt.__main__:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/yt/public" = ["public/favicon.ico", "public/app-icon.svg", "public/app-icon.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["desktop: requires a Windows desktop/Tk interpreter"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tools", "bin", "build", "dist", "release", "test-download"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

